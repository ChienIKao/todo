<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agent Todo">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Agent Todo</title>
<link rel="preload" href="fonts/Cubic_11.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="titlebar">
  <div id="titlebarDrag" class="pywebview-drag-region"><span data-icon="list-box"></span><span>Agent Todo</span></div>
  <div class="window-controls">
    <button id="windowMinimize" title="最小化" data-icon="minus"></button>
    <button id="windowMaximize" title="最大化" data-icon="square"></button>
    <button id="windowClose" title="關閉" data-icon="close"></button>
  </div>
</div>
<div id="resizeEdges" aria-hidden="true">
  <div data-resize="left"></div><div data-resize="right"></div>
  <div data-resize="top"></div><div data-resize="bottom"></div>
  <div data-resize="top-left"></div><div data-resize="top-right"></div>
  <div data-resize="bottom-left"></div><div data-resize="bottom-right"></div>
</div>
<div id="app">
  <div id="offlineBanner" class="hidden" role="status">連不到電腦，顯示的是上次的資料</div>
  <header class="top">
    <form id="quickAdd" autocomplete="off">
      <input id="newTitle" placeholder="明天下午3點 交報告 #工作 !高" required>
      <button type="button" id="moreBtn" class="icon" title="更多欄位" data-icon="more-horizontal"></button>
      <div id="quickPreview" class="badges"></div>
      <div id="more" class="hidden">
        <textarea id="newContext" rows="4" placeholder="背景／脈絡：AI 會讀這段，寫清楚就不用再重講（連結、要求、驗收條件…）"></textarea>
        <div class="row">
          <input id="newProject" placeholder="專案（名稱或 repo 路徑）" list="projects">
          <select id="newPriority">
            <option value="">優先度</option>
            <option value="normal">普通</option>
            <option value="high">高</option>
            <option value="low">低</option>
          </select>
        </div>
        <div class="row">
          <input id="newAssignee" placeholder="負責（me／claude／codex）" list="assignees">
          <input id="newDue" type="date">
        </div>
        <input id="newTags" placeholder="標籤，用逗號分隔">
        <div class="row">
          <select id="newRepeat"><option value="">重複規則</option><option value="daily">每天</option><option value="weekdays">平日</option><option value="weekly">每週</option><option value="monthly">每月</option><option value="yearly">每年</option></select>
          <input id="newRemind" type="datetime-local" aria-label="提醒">
        </div>
        <button type="submit" class="primary">新增</button>
      </div>
    </form>
    <div class="bar">
      <select id="filterProject"><option value="">全部專案</option></select>
      <input id="filterQuery" placeholder="搜尋…">
      <button id="themeBtn" class="icon" title="切換主題"></button>
      <button id="miniBtn" class="icon" title="置頂小視窗" data-icon="picture-in-picture"></button>
      <button id="aiBtn" class="icon" title="接上 AI" data-icon="robot"></button>
      <button id="mobileBtn" class="icon" title="手機存取" data-icon="smartphone"></button>
    </div>
    <nav id="tabs" aria-label="檢視"></nav>
  </header>
  <main id="board"></main>
</div>

<div id="aiPanel" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-head"><b>接上 AI</b><button id="aiClose" class="icon" title="關閉" data-icon="close"></button></div>
    <div id="aiBody"></div>
  </div>
</div>

<div id="mobilePanel" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-head"><b>手機存取</b><button id="mobileClose" class="icon" title="關閉" data-icon="close"></button></div>
    <div id="mobileBody"></div>
  </div>
</div>
<div id="mini" class="hidden">
  <div class="mini-head pywebview-drag-region">
    <b>待辦</b><span id="miniCount"></span>
    <button id="miniExpand" class="icon" title="回主視窗" data-icon="external-link"></button>
    <button id="miniClose" class="icon" title="關閉小視窗" data-icon="close"></button>
  </div>
  <form id="miniAdd" autocomplete="off"><input id="miniTitle" placeholder="新增待辦…"></form>
  <div id="miniList"></div>
</div>

<datalist id="projects"></datalist>
<datalist id="assignees"><option value="me"><option value="claude"><option value="codex"></datalist>
<div id="toast" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
